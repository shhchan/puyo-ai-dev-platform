schema_version: puyo.deep_chain_builder.backend_config.v1
config_version: "1.0"

# Keep existing callers on the Python implementation unless a runtime or
# canonical benchmark explicitly selects native.
default_backend: python

canonical:
  required_backend: native
  profiles:
    - reference

native:
  # One native call coordinates up to all six deterministic scenarios.
  execution_mode: scenario-6
  max_response_bytes: 16777216

auto:
  # Automatic rollback is diagnostic-only. Canonical reference runs fail
  # closed on an unavailable/incompatible/debug native extension.
  fallback_profiles:
    - smoke
