name: deep-chain native extension

on:
  pull_request:
    paths:
      - ".github/workflows/native-extension.yml"
      - "agents/deep_chain_native.py"
      - "agents/deep_chain_native_evaluator.py"
      - "agents/deep_chain_native_transition.py"
      - "docs/benchmarks/puyo-201-native-chain-structure/**"
      - "docs/benchmarks/puyo-219-evaluator-hot-path/**"
      - "docs/development/puyo-219-native-evaluator-hot-path-profile.md"
      - "docs/benchmarks/puyo-223-quiescence-frontier/**"
      - "docs/development/puyo-223-quiescence-frontier.md"
      - "docs/benchmarks/puyo-200-native-compact-transition/**"
      - "docs/benchmarks/puyo-205-native-compact-profile/**"
      - "docs/benchmarks/puyo-206-native-compact-hot-path/**"
      - "docs/benchmarks/puyo-207-native-transition-verification/**"
      - "docs/benchmarks/puyo-211-quiet-transition-investigation/**"
      - "docs/benchmarks/puyo-213-transition-restart-decision/**"
      - "eval/deep_chain_native_transition_benchmark.py"
      - "eval/deep_chain_native_evaluator_benchmark.py"
      - "eval/deep_chain_native_evaluator_profile.py"
      - "eval/deep_chain_native_quiescence_frontier.py"
      - "eval/deep_chain_native_transition_corpus.json"
      - "eval/deep_chain_native_transition_profile.py"
      - "eval/deep_chain_native_transition_investigation.py"
      - "eval/deep_chain_native_transition_restart_decision.py"
      - "native/deep_chain_native/**"
      - "requirements-native.txt"
      - "rust-toolchain.toml"
      - "scripts/build_deep_chain_native.sh"
      - "tests/test_deep_chain_native.py"
      - "tests/test_deep_chain_native_evaluator.py"
      - "tests/test_deep_chain_native_evaluator_benchmark.py"
      - "tests/test_deep_chain_native_evaluator_profile.py"
      - "tests/test_deep_chain_native_quiescence_frontier.py"
      - "tests/test_deep_chain_native_transition.py"
      - "tests/test_deep_chain_native_transition_benchmark.py"
      - "tests/test_deep_chain_native_transition_profile.py"
      - "tests/test_deep_chain_native_transition_investigation.py"
      - "tests/test_deep_chain_native_transition_restart_decision.py"
  push:
    paths:
      - ".github/workflows/native-extension.yml"
      - "agents/deep_chain_native.py"
      - "agents/deep_chain_native_evaluator.py"
      - "agents/deep_chain_native_transition.py"
      - "docs/benchmarks/puyo-201-native-chain-structure/**"
      - "docs/benchmarks/puyo-219-evaluator-hot-path/**"
      - "docs/development/puyo-219-native-evaluator-hot-path-profile.md"
      - "docs/benchmarks/puyo-223-quiescence-frontier/**"
      - "docs/development/puyo-223-quiescence-frontier.md"
      - "docs/benchmarks/puyo-200-native-compact-transition/**"
      - "docs/benchmarks/puyo-205-native-compact-profile/**"
      - "docs/benchmarks/puyo-206-native-compact-hot-path/**"
      - "docs/benchmarks/puyo-207-native-transition-verification/**"
      - "docs/benchmarks/puyo-211-quiet-transition-investigation/**"
      - "docs/benchmarks/puyo-213-transition-restart-decision/**"
      - "eval/deep_chain_native_transition_benchmark.py"
      - "eval/deep_chain_native_evaluator_benchmark.py"
      - "eval/deep_chain_native_evaluator_profile.py"
      - "eval/deep_chain_native_quiescence_frontier.py"
      - "eval/deep_chain_native_transition_corpus.json"
      - "eval/deep_chain_native_transition_profile.py"
      - "eval/deep_chain_native_transition_investigation.py"
      - "eval/deep_chain_native_transition_restart_decision.py"
      - "native/deep_chain_native/**"
      - "requirements-native.txt"
      - "rust-toolchain.toml"
      - "scripts/build_deep_chain_native.sh"
      - "tests/test_deep_chain_native.py"
      - "tests/test_deep_chain_native_evaluator.py"
      - "tests/test_deep_chain_native_evaluator_benchmark.py"
      - "tests/test_deep_chain_native_evaluator_profile.py"
      - "tests/test_deep_chain_native_quiescence_frontier.py"
      - "tests/test_deep_chain_native_transition.py"
      - "tests/test_deep_chain_native_transition_benchmark.py"
      - "tests/test_deep_chain_native_transition_profile.py"
      - "tests/test_deep_chain_native_transition_investigation.py"
      - "tests/test_deep_chain_native_transition_restart_decision.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cp312-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-native.txt
      - name: Create test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.txt
          .venv/bin/python -m pip install ruff==0.16.0
      - name: Build and install release wheel
        run: ./scripts/build_deep_chain_native.sh
      - name: Check Rust format, lint, and units
        run: |
          cargo fmt --manifest-path native/deep_chain_native/Cargo.toml -- --check
          rustfmt --edition 2021 --check eval/puyo_211_color_plane_candidate.rs
          cargo clippy --locked --manifest-path native/deep_chain_native/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path native/deep_chain_native/Cargo.toml
          rustc --edition=2021 -C opt-level=3 -C codegen-units=1 -C target-cpu=x86-64 eval/puyo_211_color_plane_candidate.rs -o /tmp/puyo-211-color-plane-candidate
      - name: Run Python boundary tests
        run: |
          .venv/bin/ruff check agents/deep_chain_native.py agents/deep_chain_native_evaluator.py agents/deep_chain_native_transition.py eval/deep_chain_native_evaluator_benchmark.py eval/deep_chain_native_evaluator_profile.py eval/deep_chain_native_quiescence_frontier.py eval/deep_chain_native_transition_benchmark.py eval/deep_chain_native_transition_profile.py eval/deep_chain_native_transition_investigation.py eval/deep_chain_native_transition_restart_decision.py tests/test_deep_chain_native.py tests/test_deep_chain_native_evaluator.py tests/test_deep_chain_native_evaluator_benchmark.py tests/test_deep_chain_native_evaluator_profile.py tests/test_deep_chain_native_quiescence_frontier.py tests/test_deep_chain_native_transition.py tests/test_deep_chain_native_transition_benchmark.py tests/test_deep_chain_native_transition_profile.py tests/test_deep_chain_native_transition_investigation.py tests/test_deep_chain_native_transition_restart_decision.py
          .venv/bin/python -m unittest tests.test_deep_chain_native tests.test_deep_chain_native_evaluator tests.test_deep_chain_native_evaluator_benchmark tests.test_deep_chain_native_evaluator_profile tests.test_deep_chain_native_quiescence_frontier tests.test_deep_chain_native_transition tests.test_deep_chain_native_transition_benchmark tests.test_deep_chain_native_transition_profile tests.test_deep_chain_native_transition_investigation tests.test_deep_chain_native_transition_restart_decision
          .venv/bin/python -m eval.deep_chain_native_evaluator_benchmark verify
          .venv/bin/python -m eval.deep_chain_native_quiescence_frontier verify
          .venv/bin/python -m eval.deep_chain_native_transition_restart_decision
