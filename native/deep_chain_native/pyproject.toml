[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "puyo-deep-chain-native"
version = "0.3.0"
description = "Decision-level native boundary for puyo_ai_dev_platform"
requires-python = "==3.12.*"
license = "MIT"
license-files = ["LICENSE-MIT", "LICENSE-AMA-MIT", "NOTICE"]

[tool.maturin]
bindings = "pyo3"
module-name = "_puyo_deep_chain_native"
manifest-path = "Cargo.toml"
